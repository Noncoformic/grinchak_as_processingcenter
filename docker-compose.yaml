services:
  processing-center-db:
    image: postgres:16
    container_name: processing-center-db
    restart: always
    environment:
      POSTGRES_DB: ${PROCESSING_POSTGRES_DB}
      POSTGRES_USER: ${PROCESSING_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PROCESSING_POSTGRES_PASSWORD}
    ports:
      - "${PROCESSING_POSTGRES_PORT}:5432"
    volumes:
      - processing-center-db-data:/var/lib/postgresql/data

  processing-center-redis:
    image: redis:7
    container_name: processing-center-redis
    restart: always
    ports:
      - "6381:6379"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak
    environment:
      KC_DB: dev-file
      KEYCLOAK_ADMIN: 
      KEYCLOAK_ADMIN_PASSWORD: 
    ports:
      - "8089:8080"
    command: start-dev

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: always
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: localhost:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181

volumes:
  processing-center-db-data:
  zookeeper-data:
  kafka-data:
